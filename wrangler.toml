name = "pandaemonium-architecture"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_als"]

[[routes]]
pattern = "a211h.yaytso.art"
custom_domain = true

[[routes]]
pattern = "atek639.calarts.app"
custom_domain = true

# Magic-link sign-in mail. `remote = true` so `wrangler dev` sends through the
# real service instead of pretending to.
[[send_email]]
name = "EMAIL"
remote = true
allowed_sender_addresses = ["login@calarts.app"]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "pandaemonium-db"
database_id = "4b157896-5fef-4f9e-8c5a-0fc6b03b0335"
